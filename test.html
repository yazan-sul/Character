<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Character Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="css/test.css">
  <link rel="icon" href="img/favicon.ico" sizes="any" />

</head>

<body class="darkMode">
  
    <div class="container">
    <h1 id="analyze-text">Analyze your text in real-time</h1>
 
    
    <div class="cards-container">
      <div class="total-card">
        <h3 id="total-char">00</h3>
        <label for="total-char">Total Characters</label>
      </div>
      <div class="word-card">
        <h3 id="word-count">00</h3>
        <label for="word-count">Word Count</label>
      </div>
      <div class="senctence-card">
        <h3 id="senctence-count">00</h3>
        <label for="senctence-count">Senctence Count</label>
      </div>

    </div>
    
  </div>
  
  <script src="js/index.js"></script>
</body>

</html>
